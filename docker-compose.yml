# Full stack locally: PostgreSQL (stands in for Supabase, same schema), FastAPI and the React UI.
#   docker compose up --build      ->  http://localhost:8080
# To use a real Supabase project instead, remove the `db` service and set DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      SIGNING_SECRET: ${SIGNING_SECRET:-compose-dev-secret-change-me}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_KEY: ${API_KEY:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
